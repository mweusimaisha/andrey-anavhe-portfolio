<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Creative Sprint Board – WinzTV</title>
<style>
  :root{--accent:#e8ff47;--dark:#0d0d0d;--surface:#161616;--card:#1e1e1e;--border:#2a2a2a;--text:#f0f0f0;--muted:#888}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--dark);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;min-height:100vh}

  /* HEADER */
  .topbar{background:#111;border-bottom:1px solid var(--border);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .topbar-meta{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px}
  .topbar-title{font-weight:800;font-size:16px}
  .topbar-title span{color:var(--accent)}
  .topbar-right{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .topbar-right b{color:var(--accent)}

  /* STATS */
  .stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 20px}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px}
  .stat-num{font-size:24px;font-weight:800}
  .stat-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-top:2px}

  /* PROJECT TABS */
  .proj-tabs{display:flex;gap:8px;padding:0 20px 14px;flex-wrap:wrap}
  .proj-tab{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:12px;color:var(--muted);font-weight:500;display:flex;flex-direction:column;gap:4px;min-width:160px;transition:all .15s;text-align:left}
  .proj-tab.active{background:var(--accent);color:var(--dark);border-color:var(--accent);font-weight:800}
  .proj-tab-code{font-size:10px;opacity:.7}
  .proj-tab-bar{width:100%;height:3px;background:rgba(0,0,0,.15);border-radius:2px;overflow:hidden}
  .proj-tab-fill{height:100%;background:rgba(0,0,0,.35);border-radius:2px}
  .proj-tab:not(.active) .proj-tab-bar{background:#2a2a2a}
  .proj-tab:not(.active) .proj-tab-fill{background:var(--accent)}

  /* PROJECT HEADER */
  .proj-header{background:var(--card);border:1px solid var(--border);border-radius:10px;margin:0 20px 14px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
  .proj-header-left{flex:1;min-width:200px}
  .proj-badges{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
  .proj-code{font-size:10px;background:#2a2a2a;color:var(--muted);padding:2px 8px;border-radius:4px;font-weight:700}
  .proj-cat{font-size:10px;background:#2a2a2a;color:var(--muted);padding:2px 8px;border-radius:4px}
  .proj-due{font-size:10px;color:var(--accent)}
  .proj-title{font-weight:800;font-size:15px;margin-bottom:6px}
  .progress-wrap{display:flex;align-items:center;gap:8px}
  .progress-bar{flex:1;height:6px;background:#2a2a2a;border-radius:3px;overflow:hidden}
  .progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
  .progress-pct{font-size:12px;color:var(--muted);min-width:32px}
  .team-avatars{display:flex;gap:6px;align-items:center}
  .avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;cursor:default;position:relative;flex-shrink:0}
  .avatar:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);background:#111;color:var(--text);padding:4px 8px;border-radius:6px;font-size:10px;white-space:nowrap;border:1px solid var(--border);pointer-events:none;z-index:10}

  /* VIEW TOGGLE & FILTERS */
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 20px 14px}
  .view-btns{display:flex;gap:4px}
  .view-btn{background:#2a2a2a;border:none;color:var(--muted);border-radius:6px;padding:4px 12px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
  .view-btn.active{background:var(--accent);color:var(--dark)}
  .filter-btns{display:flex;gap:4px;flex-wrap:wrap}
  .filter-btn{background:#2a2a2a;border:none;color:var(--muted);border-radius:6px;padding:3px 10px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
  .filter-btn.active{background:var(--accent);color:var(--dark)}

  /* KANBAN */
  .kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 20px}
  .kanban-col-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .kanban-count{font-size:11px;color:var(--muted);background:#2a2a2a;border-radius:10px;padding:1px 7px}
  .kanban-cards{display:flex;flex-direction:column;gap:8px;min-height:40px}
  .task-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .15s}
  .task-card:hover{border-color:var(--accent)}
  .task-card-title{font-size:12px;font-weight:600;margin-bottom:8px;line-height:1.4}
  .task-card-footer{display:flex;justify-content:space-between;align-items:center}
  .task-due{font-size:10px;color:#666}
  .empty-col{border:1px dashed #2a2a2a;border-radius:10px;padding:20px 12px;text-align:center;color:#444;font-size:11px}

  /* LIST */
  .list-view{margin:0 20px;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .list-head{display:grid;grid-template-columns:1fr 80px 90px 80px 80px 34px;gap:8px;padding:8px 14px;background:var(--surface);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
  .list-row{display:grid;grid-template-columns:1fr 80px 90px 80px 80px 34px;gap:8px;padding:10px 14px;align-items:center;border-top:1px solid #1e1e1e}
  .list-row:nth-child(odd){background:#111}
  .list-title{font-size:12px;font-weight:500;padding-left:8px;border-left:3px solid transparent}
  .advance-btn{background:#2a2a2a;border:none;border-radius:5px;color:var(--muted);cursor:pointer;padding:3px 6px;font-size:13px}
  .advance-btn:hover{color:var(--accent)}

  /* BADGES */
  .badge{display:inline-block;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  .s-done    {background:#dcfce7;color:#166534}
  .s-review  {background:#fef9c3;color:#854d0e}
  .s-progress{background:#dbeafe;color:#1e40af}
  .s-blocked {background:#fee2e2;color:#991b1b}
  .s-todo    {background:#f3f4f6;color:#374151}
  .p-high  {color:#ef4444;font-weight:700;font-size:11px}
  .p-medium{color:#f59e0b;font-weight:700;font-size:11px}
  .p-low   {color:#22c55e;font-weight:700;font-size:11px}

  /* TEAM LEGEND */
  .team-legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:16px 20px}
  .team-legend-lbl{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1px}
  .team-member{display:flex;align-items:center;gap:5px}
  .member-name{font-size:11px;font-weight:600}
  .member-role{font-size:10px;color:#666}

  .hint{padding:10px 20px;font-size:10px;color:#444}

  @media(max-width:700px){
    .stats-bar{grid-template-columns:1fr 1fr}
    .kanban{grid-template-columns:1fr 1fr}
    .list-head,.list-row{grid-template-columns:1fr 70px 80px 34px}
    .list-head .lh-owner,.list-head .lh-prio,.list-row .lr-owner,.list-row .lr-prio{display:none}
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-meta">Portfolio Sample · Andrey Anavhe · Creative Lead</div>
    <div class="topbar-title">WinzTV <span>Creative Sprint Board</span></div>
  </div>
  <div class="topbar-right">Sprint: <b>Weeks 34–37 · Sep 2024</b></div>
</div>

<div class="stats-bar">
  <div class="stat-card"><div class="stat-num" id="st-total" style="color:#60a5fa">0</div><div class="stat-lbl">Total Tasks</div></div>
  <div class="stat-card"><div class="stat-num" id="st-done"  style="color:#34d399">0</div><div class="stat-lbl">Completed</div></div>
  <div class="stat-card"><div class="stat-num" id="st-review" style="color:#fbbf24">0</div><div class="stat-lbl">In Review</div></div>
  <div class="stat-card"><div class="stat-num" id="st-blocked" style="color:#f87171">0</div><div class="stat-lbl">Blocked</div></div>
</div>

<div class="proj-tabs" id="proj-tabs"></div>
<div class="proj-header" id="proj-header"></div>

<div class="controls">
  <div class="view-btns">
    <button class="view-btn active" id="btn-kanban" onclick="setView('kanban')">🗂 Kanban</button>
    <button class="view-btn" id="btn-list" onclick="setView('list')">☰ List</button>
  </div>
  <div class="filter-btns" id="filter-btns"></div>
</div>

<div id="kanban-view" class="kanban"></div>
<div id="list-view" class="list-view" style="display:none"></div>

<div class="team-legend" id="team-legend"></div>
<div class="hint">Click any task card (Kanban) or → (List) to advance its status. All data is illustrative.</div>

<script>
const TEAM = {
  AA:{name:"Andrey Anavhe",role:"Creative Lead",  color:"#e8ff47",bg:"#1a1a00"},
  ED:{name:"Dev E.",        role:"Editor",          color:"#60a5fa",bg:"#0a1628"},
  GD:{name:"Tara M.",       role:"Designer",        color:"#f472b6",bg:"#1a0a14"},
  HC:{name:"Jordan K.",     role:"Host / Talent",   color:"#34d399",bg:"#051a10"},
  SW:{name:"Priya S.",      role:"Script Writer",   color:"#fb923c",bg:"#1a0a00"},
};

const STATUSES = {
  done:    {label:"Done",        cls:"s-done"},
  review:  {label:"In Review",   cls:"s-review"},
  progress:{label:"In Progress", cls:"s-progress"},
  blocked: {label:"Blocked",     cls:"s-blocked"},
  todo:    {label:"To Do",       cls:"s-todo"},
};

const PRIO = {
  high:  {label:"High",   cls:"p-high"},
  medium:{label:"Medium", cls:"p-medium"},
  low:   {label:"Low",    cls:"p-low"},
};

const STATUS_ORDER = ["todo","progress","review","done","blocked"];
const COLS = ["todo","progress","review","done"];

const projects = [
  {id:1,title:"5 African Athletes Redefining the Game",code:"WTV-024",progress:72,due:"Sep 20",cat:"Video Feature",sprint:"Wk 36",tasks:[
    {id:1,title:"Script draft & host briefing",          owner:"SW",status:"done",    priority:"high",  due:"Sep 5"},
    {id:2,title:"Narration / VO recording",             owner:"HC",status:"done",    priority:"high",  due:"Sep 10"},
    {id:3,title:"Lower thirds & stat graphics (×5)",    owner:"GD",status:"done",    priority:"medium",due:"Sep 11"},
    {id:4,title:"Thumbnail A/B options",                owner:"GD",status:"done",    priority:"medium",due:"Sep 12"},
    {id:5,title:"Long-form edit (8–12 min)",            owner:"ED",status:"review",  priority:"high",  due:"Sep 13"},
    {id:6,title:"Short-form cuts ×3 (Reels/TikTok)",   owner:"ED",status:"progress",priority:"high",  due:"Sep 14"},
    {id:7,title:"Social copy pack",                     owner:"SW",status:"progress",priority:"medium",due:"Sep 15"},
    {id:8,title:"Creative Lead final review",           owner:"AA",status:"todo",    priority:"high",  due:"Sep 17"},
    {id:9,title:"Publish to YouTube + schedule IG",    owner:"AA",status:"todo",    priority:"medium",due:"Sep 20"},
  ]},
  {id:2,title:"WinzTV Season 2 Intro Package",code:"WTV-020",progress:95,due:"Sep 8",cat:"Brand / Motion",sprint:"Wk 35",tasks:[
    {id:1,title:"New logo animation (3 variants)",      owner:"GD",status:"done",  priority:"high",  due:"Sep 1"},
    {id:2,title:"Intro jingle — brief to audio team",  owner:"AA",status:"done",  priority:"high",  due:"Sep 1"},
    {id:3,title:"Lower third template system",          owner:"GD",status:"done",  priority:"medium",due:"Sep 3"},
    {id:4,title:"Outro card + subscribe CTA",           owner:"ED",status:"done",  priority:"low",   due:"Sep 4"},
    {id:5,title:"Full package QA & final export",       owner:"AA",status:"review",priority:"high",  due:"Sep 7"},
    {id:6,title:"Deploy across all scheduled videos",  owner:"ED",status:"todo",  priority:"medium",due:"Sep 8"},
  ]},
  {id:3,title:"Afrobeats vs Amapiano — The Debate",code:"WTV-025",progress:25,due:"Sep 28",cat:"Opinion / Feature",sprint:"Wk 37",tasks:[
    {id:1,title:"Research brief — key talking points",  owner:"SW",status:"done",    priority:"high",  due:"Sep 12"},
    {id:2,title:"Script v1 — debate format structure",  owner:"SW",status:"progress",priority:"high",  due:"Sep 16"},
    {id:3,title:"Set design concept for debate format", owner:"GD",status:"todo",    priority:"medium",due:"Sep 17"},
    {id:4,title:"Host prep & talking points review",    owner:"HC",status:"todo",    priority:"high",  due:"Sep 18"},
    {id:5,title:"Film / record debate segments",        owner:"ED",status:"todo",    priority:"high",  due:"Sep 21"},
    {id:6,title:"Edit — full feature + short clips",   owner:"ED",status:"todo",    priority:"high",  due:"Sep 25"},
    {id:7,title:"Graphics — data viz & motion cards",  owner:"GD",status:"todo",    priority:"medium",due:"Sep 24"},
    {id:8,title:"Final review & publish",              owner:"AA",status:"todo",    priority:"high",  due:"Sep 28"},
  ]},
  {id:4,title:"Community Spotlight — Fan of the Month",code:"WTV-022",progress:100,due:"Sep 1",cat:"Community",sprint:"Wk 34",tasks:[
    {id:1,title:"Fan submission review & selection",   owner:"AA",status:"done",priority:"medium",due:"Aug 25"},
    {id:2,title:"Interview script & questions",        owner:"SW",status:"done",priority:"medium",due:"Aug 26"},
    {id:3,title:"Record fan interview (remote)",       owner:"HC",status:"done",priority:"high",  due:"Aug 28"},
    {id:4,title:"Edit — 3 min spotlight video",       owner:"ED",status:"done",priority:"high",  due:"Aug 30"},
    {id:5,title:"Thumbnail + social graphic",         owner:"GD",status:"done",priority:"low",   due:"Aug 30"},
    {id:6,title:"Publish + community post",           owner:"AA",status:"done",priority:"medium",due:"Sep 1"},
  ]},
];

let activeProj = 0;
let activeFilter = "All";
let activeView = "kanban";

function avatar(code, size=28) {
  const m = TEAM[code];
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${m.bg};border:2px solid ${m.color};color:${m.color};font-size:${size*.35}px" data-tip="${m.name} — ${m.role}">${code}</div>`;
}

function badge(status) {
  const s = STATUSES[status];
  return `<span class="badge ${s.cls}">${s.label}</span>`;
}

function recalcProgress(proj) {
  const done = proj.tasks.filter(t=>t.status==="done").length;
  return Math.round(done/proj.tasks.length*100);
}

function updateStats() {
  const all = projects.flatMap(p=>p.tasks);
  document.getElementById("st-total").textContent   = all.length;
  document.getElementById("st-done").textContent    = all.filter(t=>t.status==="done").length;
  document.getElementById("st-review").textContent  = all.filter(t=>t.status==="review").length;
  document.getElementById("st-blocked").textContent = all.filter(t=>t.status==="blocked").length;
}

function renderTabs() {
  const el = document.getElementById("proj-tabs");
  el.innerHTML = projects.map((p,i)=>`
    <button class="proj-tab ${i===activeProj?"active":""}" onclick="setProject(${i})">
      <span class="proj-tab-code">${p.code} · ${p.sprint}</span>
      <span>${p.title}</span>
      <div class="proj-tab-bar"><div class="proj-tab-fill" style="width:${p.progress}%"></div></div>
    </button>`).join("");
}

function renderProjHeader() {
  const p = projects[activeProj];
  document.getElementById("proj-header").innerHTML = `
    <div class="proj-header-left">
      <div class="proj-badges">
        <span class="proj-code">${p.code}</span>
        <span class="proj-cat">${p.cat}</span>
        <span class="proj-due">Due ${p.due}</span>
      </div>
      <div class="proj-title">${p.title}</div>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" style="width:${p.progress}%"></div></div>
        <span class="progress-pct">${p.progress}%</span>
      </div>
    </div>
    <div class="team-avatars">${Object.keys(TEAM).map(k=>avatar(k,30)).join("")}</div>`;
}

function renderFilters() {
  const filters = ["All","done","progress","review","blocked","todo"];
  document.getElementById("filter-btns").innerHTML = filters.map(f=>`
    <button class="filter-btn ${activeFilter===f?"active":""}" onclick="setFilter('${f}')">
      ${f==="All"?"All":STATUSES[f].label}
    </button>`).join("");
}

function renderKanban() {
  const p = projects[activeProj];
  const el = document.getElementById("kanban-view");
  el.innerHTML = COLS.map(col=>{
    const tasks = p.tasks.filter(t=>t.status===col);
    return `
      <div>
        <div class="kanban-col-head">
          ${badge(col)}
          <span class="kanban-count">${tasks.length}</span>
        </div>
        <div class="kanban-cards">
          ${tasks.length ? tasks.map(t=>`
            <div class="task-card" onclick="advanceTask(${p.id},${t.id})" style="border-left:3px solid ${PRIO[t.priority]?PRIO[t.priority].cls==="p-high"?"#ef4444":PRIO[t.priority].cls==="p-medium"?"#f59e0b":"#22c55e":"#444"}">
              <div class="task-card-title">${t.title}</div>
              <div class="task-card-footer">
                ${avatar(t.owner,24)}
                <span class="task-due">Due ${t.due}</span>
              </div>
            </div>`).join("") : `<div class="empty-col">No tasks</div>`}
        </div>
      </div>`;
  }).join("");
}

function renderList() {
  const p = projects[activeProj];
  const tasks = activeFilter==="All" ? p.tasks : p.tasks.filter(t=>t.status===activeFilter);
  const el = document.getElementById("list-view");
  el.innerHTML = `
    <div class="list-head">
      <div>Task</div>
      <div class="lh-owner">Owner</div>
      <div>Status</div>
      <div class="lh-prio">Priority</div>
      <div>Due</div>
      <div></div>
    </div>
    ${tasks.length ? tasks.map((t,i)=>`
      <div class="list-row">
        <div class="list-title" style="border-left-color:${PRIO[t.priority]?PRIO[t.priority].cls==="p-high"?"#ef4444":PRIO[t.priority].cls==="p-medium"?"#f59e0b":"#22c55e":"#444"}">${t.title}</div>
        <div class="lr-owner" style="display:flex;align-items:center;gap:5px">${avatar(t.owner,22)}<span style="font-size:10px;color:var(--muted)">${t.owner}</span></div>
        <div>${badge(t.status)}</div>
        <div class="lr-prio"><span class="${PRIO[t.priority].cls}">${PRIO[t.priority].label}</span></div>
        <div style="font-size:11px;color:var(--muted)">${t.due}</div>
        <div><button class="advance-btn" onclick="advanceTask(${p.id},${t.id})" title="Advance status">→</button></div>
      </div>`).join("") : `<div style="padding:24px;text-align:center;color:#444">No tasks match this filter.</div>`}`;
}

function renderTeamLegend() {
  document.getElementById("team-legend").innerHTML = `
    <span class="team-legend-lbl">Team:</span>
    ${Object.entries(TEAM).map(([k,m])=>`
      <div class="team-member">
        ${avatar(k,22)}
        <div><div class="member-name" style="color:${m.color}">${m.name}</div><div class="member-role">${m.role}</div></div>
      </div>`).join("")}`;
}

function render() {
  renderTabs();
  renderProjHeader();
  renderFilters();
  if(activeView==="kanban") renderKanban();
  else renderList();
  renderTeamLegend();
  updateStats();
}

function setProject(i) {
  activeProj = i;
  activeFilter = "All";
  render();
}

function setFilter(f) {
  activeFilter = f;
  renderFilters();
  if(activeView==="list") renderList();
  else renderKanban();
}

function setView(v) {
  activeView = v;
  document.getElementById("kanban-view").style.display = v==="kanban"?"grid":"none";
  document.getElementById("list-view").style.display   = v==="list"?"block":"none";
  document.getElementById("btn-kanban").classList.toggle("active", v==="kanban");
  document.getElementById("btn-list").classList.toggle("active",   v==="list");
  if(v==="kanban") renderKanban();
  else renderList();
}

function advanceTask(projId, taskId) {
  const p = projects.find(p=>p.id===projId);
  const t = p.tasks.find(t=>t.id===taskId);
  const idx = STATUS_ORDER.indexOf(t.status);
  t.status = STATUS_ORDER[(idx+1) % STATUS_ORDER.length];
  p.progress = recalcProgress(p);
  render();
}

render();
</script>
</body>
</html>
